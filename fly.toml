# Fly.io config for the BTC Tracker · Nwachukwu Model.
# See https://fly.io/docs/reference/configuration/ for details.
app = "btc-tracker"
primary_region = "iad"

[build]

[http_service]
  internal_port = 8080
  force_https = true
  # Scale to zero when idle, wake on the next request (keeps cost minimal).
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 1024
